name: Sync milestones to Notion

"on":
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      sync_all_history:
        description: "Regenerate documentation for all commits since Day 1"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync-milestones:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Generate daily milestones
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SYNC_ALL_HISTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_all_history || false }}
        run: python scripts/sync_milestones.py