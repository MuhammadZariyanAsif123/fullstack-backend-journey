name: Auto-Sync Engineering Docs to Notion

on:
  push:
    branches:
      - master  # Triggers automatically whenever you push code to master

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Ensures git log history is fully available to the script

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests google-genai

    - name: Run Documentation Automation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      run: |
        python backend/scripts/sync_milestones.py